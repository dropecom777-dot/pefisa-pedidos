<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de Pedido – Atacadão Pefisa</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e1e4ea;--pri:#0b5fff;--ok:#12805c;--okbg:#e2f6ee;--wait:#b25e09;--waitbg:#fff1dc}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1218;--card:#1a1f29;--tx:#f1f3f7;--mut:#9aa3b2;--bd:#2b3240;--pri:#5b8cff;--ok:#4cd6a0;--okbg:#10382b;--wait:#ffb55c;--waitbg:#3b2a10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{padding:16px;text-align:center;background:var(--card);border-bottom:1px solid var(--bd);font-weight:800;font-size:18px}
main{max-width:480px;margin:0 auto;padding:18px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
h1{font-size:18px;margin:0 0 12px}
input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:20px;text-align:center;margin-bottom:10px}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.res{margin-top:16px;border-radius:14px;padding:18px;text-align:center}
.res .big{font-size:clamp(32px,10vw,52px);font-weight:800;line-height:1.1}
.res p{margin:8px 0 0;color:var(--mut)}
.res.ok{background:var(--okbg)}.res.ok .big{color:var(--ok)}
.res.wait{background:var(--waitbg)}.res.wait .big{color:var(--wait)}
.res.neutral{background:var(--bg);border:1px solid var(--bd)}
small{display:block;text-align:center;color:var(--mut);margin-top:14px}
</style>
</head>
<body>
<header>🛒 Atacadão Pefisa</header>
<main>
  <div class="card">
    <h1>Consulte seu pedido</h1>
    <input id="q" placeholder="Nº do pedido" autocomplete="off" inputmode="text">
    <button id="go">Consultar</button>
    <div id="res"></div>
  </div>
  <small>A tela atualiza sozinha. Avisaremos também pelo WhatsApp, se você informou o número.</small>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient("https://fgdqkflpirqrelhixpvn.supabase.co", "sb_publishable_jO5dg7oBFxvup4SJUbaIAQ_PFNDFBlS");
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hora = v => v ? new Date(v).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "";
let timer = null;

function box(cls, big, txt){ $("#res").innerHTML = `<div class="res ${cls}"><div class="big">${big}</div><p>${txt}</p></div>`; }

async function consultar(silencioso){
  const q = $("#q").value.trim();
  if (!q) { $("#res").innerHTML = ""; return; }
  if (!silencioso) box("neutral", "…", "Consultando");
  const {data, error} = await sb.rpc("consultar_pedido", {p_numero:q});
  clearTimeout(timer);
  if (error) { box("neutral", "Ops", "Não foi possível consultar agora. Tente novamente."); return; }
  const o = data && data[0], n = o ? esc(o.numero) : esc(q);
  if (!o) { box("neutral", "Não encontrado", "Confira o número do pedido ou fale com o balcão."); return; }
  if (o.status === "pronto") box("ok", "✅ Pronto!", `Pedido ${n} já pode ser retirado no balcão.`);
  else if (o.status === "retirado") box("neutral", "📦 Já retirado", `Pedido ${n} foi retirado às ${hora(o.picked_at)}.`);
  else if (o.status === "cancelado") box("neutral", "Cancelado", `Pedido ${n} foi cancelado. Fale com o balcão.`);
  else { box("wait", "⏳ Em preparo", `Pedido ${n}. Estamos separando seus produtos.`); timer = setTimeout(() => consultar(true), 15000); }
}

$("#go").onclick = () => consultar(false);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") consultar(false); });

/* abre direto com ?pedido=123 ou #123 (útil para QR code e links) */
const pre = new URLSearchParams(location.search).get("pedido") || location.hash.replace("#", "");
if (pre) { $("#q").value = decodeURIComponent(pre); consultar(false); }
</script>
</body>
</html>
