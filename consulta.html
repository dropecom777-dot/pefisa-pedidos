<title>Consulta de Pedido – Atacadão Pefisa</title>
<style>
:root{color-scheme:light;--bg:#e3e8f1;--card:#f6f8fc;--field:#eceff7;--tx:#1b2236;--mut:#5a6579;--bd:#c8d1e2;--pri:#262e77;--ok:#16704a;--okbg:#d4ebdd;--wait:#9a5607;--waitbg:#f6e3bd;--danger:#b3261e;--sep:#0b6e9e;--sepbg:#d1e6f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:var(--pri);color:#fff;border-bottom:5px solid;border-image:linear-gradient(90deg,#e4111c,#8f1d4f,#262e77 55%,#08abe6) 1;font-weight:700;font-size:20px;letter-spacing:-.01em;box-shadow:0 2px 8px rgba(20,30,70,.25)}
header img{height:58px;width:58px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
main{max-width:480px;margin:0 auto;padding:20px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,30,70,.08)}
h1{font-size:18px;font-weight:700;margin:0 0 12px}
input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--field);color:var(--tx);font:inherit;font-size:18px;text-align:center;margin-bottom:10px}
input:focus{outline:2px solid var(--pri);outline-offset:-1px;background:#fff}
button{width:100%;border:0;border-radius:10px;padding:14px;font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(20,30,70,.2)}
button:hover{filter:brightness(1.15)}
.res{margin-top:16px;border-radius:12px;padding:18px;text-align:center}
.res .big{font-size:clamp(24px,7.5vw,34px);font-weight:700;line-height:1.15}
.res p{margin:8px 0 0;color:#3d4960}
.res.ok{background:var(--okbg)}.res.ok .big{color:var(--ok)}
.res.wait{background:var(--waitbg)}.res.wait .big{color:var(--wait)}
.res.sep{background:var(--sepbg)}.res.sep .big{color:var(--sep)}
.res.neutral{background:var(--field);border:1px solid var(--bd)}
.steps{display:flex;gap:6px;margin-top:14px}
.steps span{flex:1;font-size:12px;font-weight:600;padding:6px 4px;border-radius:6px;background:var(--card);color:var(--mut)}
.steps span.on{background:var(--pri);color:#fff}
small{display:block;text-align:center;color:var(--mut);margin-top:14px}
</style>
</head>
<body>
<header><img class="lg" alt="Logo Atacadão Pefisa"><span>Atacadão Pefisa</span></header>
<main>
  <div class="card">
    <h1>Consulte seu pedido</h1>
    <input id="q" placeholder="Nº do pedido ou telefone com DDD" autocomplete="off">
    <button id="go">Consultar</button>
    <div id="res"></div>
  </div>
  <small>A tela atualiza sozinha enquanto o pedido não estiver pronto.</small>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
document.querySelectorAll("img.lg").forEach(i => i.src = document.querySelector('link[rel=icon]').href);
const sb = supabase.createClient("https://fgdqkflpirqrelhixpvn.supabase.co", "sb_publishable_jO5dg7oBFxvup4SJUbaIAQ_PFNDFBlS");
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hora = v => v ? new Date(v).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "";
let timer = null;

const msg = (cls, big, txt) => `<div class="res ${cls}"><div class="big">${big}</div>${txt ? `<p>${txt}</p>` : ""}</div>`;

function card(o){
  const ola = o.cliente ? `Olá, <b>${esc(o.cliente)}</b>! ` : "", n = esc(o.numero);
  const step = {preparando:0, separando:1, pronto:2}[o.status];
  const steps = step === undefined ? "" : `<div class="steps">${["Pendente","Separando","Pronto"].map((t, i) => `<span class="${i <= step ? "on" : ""}">${t}</span>`).join("")}</div>`;
  const wrap = (cls, big, txt) => `<div class="res ${cls}"><div class="big">${big}</div><p>${txt}</p>${steps}</div>`;
  if (o.status === "pronto") return wrap("ok", "✅ O seu pedido já pode ser retirado", `${ola}Pedido ${n}. É só ir ao balcão.`);
  if (o.status === "separando") return wrap("sep", "📦 Separando", `${ola}Pedido ${n}. Estamos separando seus produtos.`);
  if (o.status === "preparando") return wrap("wait", "⏳ Pendente", `${ola}Pedido ${n}. Seu pedido está na fila para separação.`);
  if (o.status === "retirado") return wrap("neutral", "Já retirado", `${ola}Pedido ${n} foi retirado às ${hora(o.picked_at)}.`);
  return wrap("neutral", "Cancelado", `${ola}Pedido ${n} foi cancelado. Fale com o balcão.`);
}

async function consultar(silencioso){
  const q = $("#q").value.trim();
  if (!q) { $("#res").innerHTML = ""; return; }
  if (!silencioso) $("#res").innerHTML = msg("neutral", "…", "Consultando");
  const {data, error} = await sb.rpc("consultar_pedido", {p_busca:q});
  clearTimeout(timer);
  if (error) { $("#res").innerHTML = msg("neutral", "Ops", "Não foi possível consultar agora. Tente novamente."); return; }
  if (!data || !data.length) {
    const tel = q.replace(/\D/g, "").length >= 10;
    $("#res").innerHTML = msg("neutral", "Não encontrado", tel ? "Nenhum pedido recente com esse telefone. Confira o número com DDD ou fale com o balcão." : "Confira o número do pedido ou fale com o balcão.");
    return;
  }
  $("#res").innerHTML = data.map(card).join("");
  if (data.some(o => o.status === "preparando" || o.status === "separando")) timer = setTimeout(() => consultar(true), 15000);
}

$("#go").onclick = () => consultar(false);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") consultar(false); });

/* abre direto com ?pedido=123 ou #123 */
const pre = new URLSearchParams(location.search).get("pedido") || location.hash.replace("#", "");
if (pre) { $("#q").value = decodeURIComponent(pre); consultar(false); }
</script>
</body>
</html>
